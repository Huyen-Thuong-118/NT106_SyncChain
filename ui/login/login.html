<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TVT Logistic Login</title>
    <link rel="stylesheet" href="login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page">
        <div class="login-card">
            <div class="left-panel">
                <div class="brand">
                    <div class="brand-icon">∿</div>
                    <span>SUPPLY CHAIN</span>
                </div>

                <div class="left-content">
                    <h1>TVT Logistic</h1>
                    <div class="line"></div>
                    <p>
                        Architectural logistics management
                        for high-precision supply chain
                        operations.
                    </p>
                </div>

                <div class="left-footer">
                    <span>v1.0.0</span>
                    <span>•</span>
                </div>
            </div>

            <div class="right-panel">
                <div class="form-wrap">
                    <h2>Login</h2>
                    <p class="subtitle">AUTHENTICATION PROTOCOL REQUIRED</p>

                    <form id="loginForm">
                        <div class="form-group">
                            <label for="username">USERNAME</label>
                            <div class="input-line">
                                <span class="input-icon">◦</span>
                                <input type="text"
                                       id="username"
                                       name="username"
                                       placeholder="enterprise_id" />
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password">PASSWORD</label>
                            <div class="input-line">
                                <span class="input-icon">□</span>
                                <input type="password"
                                       id="password"
                                       name="password"
                                       placeholder="••••••••" />
                            </div>
                        </div>

                        <div class="row-between">
                            <label class="remember">
                                <input type="checkbox" />
                                <span>Remember Me</span>
                            </label>

                            <a href="#" class="link">Forgot Password?</a>
                        </div>

                        <button type="submit" class="login-btn">
                            ACCESS DASHBOARD
                        </button>

                        <p class="signup-text">
                            Don't have an account?
                            <a href="#" class="link strong">Sign Up</a>
                        </p>

                        <div class="bottom-meta">
                            <span>SECURE TERMINAL</span>
                            <span>PORT 8080 ACTIVE</span>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        alert("Vui lòng nhập đầy đủ tài khoản và mật khẩu.");
        return;
      }

      alert("Đăng nhập thành công. Có thể chuyển sang dashboard sau.");
      // window.location.href = "dashboard.html";
    });
    </script>
</body>
</html>
