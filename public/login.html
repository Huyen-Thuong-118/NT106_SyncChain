<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TVT Logistic Login</title>
    <link rel="stylesheet" href="login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page">
        <div class="login-card">
            <div class="left-panel">
                <div class="brand">
                    <div class="brand-icon">∿</div>
                    <span>SUPPLY CHAIN</span>
                </div>

                <div class="left-content">
                    <h1>TVT Logistic</h1>
                    <div class="line"></div>
                    <p>
                        Architectural logistics management
                        for high-precision supply chain
                        operations.
                    </p>
                </div>

                <div class="left-footer">
                    <span>v1.0.0</span>
                    <span>•</span>
                </div>
            </div>

            <div class="right-panel">
                <div class="form-wrap">
                    <h2>Login</h2>
                    <p class="subtitle">AUTHENTICATION PROTOCOL REQUIRED</p>

                    <form id="loginForm">
                        <div class="form-group">
                            <label for="username">USERNAME</label>
                            <div class="input-line">
                                <span class="input-icon">◦</span>
                                <input type="text"
                                       id="username"
                                       name="username"
                                       placeholder="enterprise_id" />
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password">PASSWORD</label>
                            <div class="input-line">
                                <span class="input-icon">□</span>
                                <input type="password"
                                       id="password"
                                       name="password"
                                       placeholder="••••••••" />
                            </div>
                        </div>

                        <div class="row-between">
                            <label class="remember">
                                <input type="checkbox" id="rememberCheckbox" />
                                <span>Remember Me</span>
                            </label>

                            <a href="#"  id="forgotPasswordLink" class="link">Forgot Password?</a>
                        </div>
                        
                        <br>
                        <button type="submit" class="login-btn">
                            ACCESS DASHBOARD
                        </button>
                        <br> <br>
                        <p class="signup-text">
                            Don't have an account?
                            <a href="#" id="signupLink" class="link strong">Sign Up</a>
                        </p>

                        <div class="bottom-meta">
                            <span>2026 - TVT Logistic</span>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>

     // Lấy các phần tử
    const loginForm = document.getElementById("loginForm");
    const forgotPasswordLink = document.getElementById("forgotPasswordLink");
    const signupLink = document.getElementById("signupLink");
    const rememberCheckbox = document.getElementById("rememberCheckbox");

    // Xử lý đăng nhập
    loginForm.addEventListener("submit", async function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: username,
                    password: password,
                    remember: rememberCheckbox.checked
                })
            });

            const data = await response.json();

            if (data.success) {
                alert("Đăng nhập thành công!");
                window.location.href = "/dashboard.html";
            } else {
                alert(data.message || "Đăng nhập thất bại!");
            }
        } catch (error) {
            console.error("Lỗi:", error);
            alert("Lỗi kết nối đến server!");
        }
    });

    // Chuyển sang trang Forgot Password
    forgotPasswordLink.addEventListener("click", function (e) {
        e.preventDefault();
        window.location.href = "/forgot-password.html";
    });

    // Chuyển sang trang Sign Up (Đăng ký)
    signupLink.addEventListener("click", function (e) {
        e.preventDefault();
        window.location.href = "/register.html";
    });
</script>
</body>
</html>
