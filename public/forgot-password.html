<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - SyncChain</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Background decoration */
        .bg-decoration {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
        }

        .bg-circle-1 {
            width: 300px;
            height: 300px;
            top: -150px;
            right: -150px;
        }

        .bg-circle-2 {
            width: 500px;
            height: 500px;
            bottom: -250px;
            left: -250px;
        }

        /* Main container */
        .forgot-container {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 1;
        }

        /* Card */
        .forgot-card {
            background: white;
            border-radius: 32px;
            padding: 48px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .icon-wrapper {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
            box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.3);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6B7280;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Steps indicator */
        .steps {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .step {
            width: 40px;
            height: 4px;
            background: #E5E7EB;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .step.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 60px;
        }

        .step.completed {
            background: #10B981;
        }

        /* Form steps */
        .step-form {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .step-form.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Form group */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #9CA3AF;
        }

        input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 1.5px solid #E5E7EB;
            border-radius: 16px;
            font-size: 15px;
            transition: all 0.2s;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        input.error {
            border-color: #EF4444;
        }

        /* Button */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Back link */
        .back-link {
            text-align: center;
        }

        .back-link a {
            color: #6B7280;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: #667eea;
        }

        /* Message */
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            background: #D1FAE5;
            color: #065F46;
            border: 1px solid #A7F3D0;
        }

        .message.error {
            background: #FEE2E2;
            color: #991B1B;
            border: 1px solid #FECACA;
        }

        /* Password strength */
        .password-strength {
            margin-top: 8px;
            font-size: 12px;
        }

        .strength-weak { color: #EF4444; }
        .strength-medium { color: #F59E0B; }
        .strength-strong { color: #10B981; }

        /* Info box */
        .info-box {
            background: #F3F4F6;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #6B7280;
        }

        .info-icon {
            font-size: 20px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .forgot-card {
                padding: 32px 24px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .icon-wrapper {
                width: 56px;
                height: 56px;
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-decoration">
        <div class="bg-circle bg-circle-1"></div>
        <div class="bg-circle bg-circle-2"></div>
    </div>

    <div class="forgot-container">
        <div class="forgot-card">
            <div class="header">
                <div class="icon-wrapper">
                    🔐
                </div>
                <h1>Quên mật khẩu?</h1>
                <p class="subtitle">Đừng lo! Chúng tôi sẽ giúp bạn lấy lại mật khẩu</p>
            </div>

            <!-- Steps indicator -->
            <div class="steps">
                <div class="step active" id="step1Indicator"></div>
                <div class="step" id="step2Indicator"></div>
            </div>

            <div id="message" class="message"></div>

            <!-- Step 1: Email verification -->
            <div id="step1" class="step-form active">
                <form id="emailForm">
                    <div class="form-group">
                        <label class="form-label">Email đã đăng ký</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📧</span>
                            <input 
                                type="email" 
                                id="email" 
                                placeholder="example@email.com"
                                autocomplete="off"
                            >
                        </div>
                        <div style="font-size: 12px; color: #6B7280; margin-top: 8px;">
                            Chúng tôi sẽ gửi hướng dẫn đặt lại mật khẩu
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" id="sendBtn">
                        Gửi yêu cầu
                    </button>
                </form>
            </div>

            <!-- Step 2: Reset password -->
            <div id="step2" class="step-form">
                <form id="resetForm">
                    <div class="info-box">
                        <span class="info-icon">ℹ️</span>
                        <span>Nhập mật khẩu mới cho tài khoản của bạn</span>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Mật khẩu mới</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input 
                                type="password" 
                                id="newPassword" 
                                placeholder="Tối thiểu 6 ký tự"
                            >
                        </div>
                        <div id="strength" class="password-strength"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Xác nhận mật khẩu mới</label>
                        <div class="input-wrapper">
                            <span class="input-icon">✓</span>
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                placeholder="Nhập lại mật khẩu"
                            >
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" id="resetBtn">
                        Đặt lại mật khẩu
                    </button>
                </form>
            </div>

            <div class="back-link">
                <a href="/login.html">
                    ← Quay lại đăng nhập
                </a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/auth';
        let currentStep = 1;

        // DOM elements
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step1Indicator = document.getElementById('step1Indicator');
        const step2Indicator = document.getElementById('step2Indicator');
        const messageDiv = document.getElementById('message');
        const emailInput = document.getElementById('email');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        // Show message function
        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            
            // Auto hide after 4 seconds
            setTimeout(() => {
                messageDiv.style.display = 'none';
                messageDiv.className = 'message';
            }, 4000);
        }

        // Update step UI
        function updateStepUI(step) {
            if (step === 1) {
                step1.classList.add('active');
                step2.classList.remove('active');
                step1Indicator.classList.add('active');
                step2Indicator.classList.remove('active');
                step2Indicator.classList.remove('completed');
            } else {
                step1.classList.remove('active');
                step2.classList.add('active');
                step1Indicator.classList.remove('active');
                step1Indicator.classList.add('completed');
                step2Indicator.classList.add('active');
            }
        }

        // Password strength checker
        newPasswordInput.addEventListener('input', function() {
            const password = this.value;
            const strengthDiv = document.getElementById('strength');
            
            if (password.length === 0) {
                strengthDiv.textContent = '';
                return;
            }
            
            if (password.length < 6) {
                strengthDiv.innerHTML = '<span class="strength-weak">⚠️ Yếu (cần ít nhất 6 ký tự)</span>';
            } else if (password.length < 8) {
                strengthDiv.innerHTML = '<span class="strength-medium">⚠️ Trung bình</span>';
            } else {
                strengthDiv.innerHTML = '<span class="strength-strong">✓ Mạnh</span>';
            }
        });

        // Step 1: Verify email
        async function handleEmailSubmit(event) {
            event.preventDefault();
            
            const email = emailInput.value.trim();
            
            if (!email) {
                showMessage('Vui lòng nhập email', 'error');
                return;
            }
            
            if (!isValidEmail(email)) {
                showMessage('Email không hợp lệ', 'error');
                return;
            }
            
            const btn = document.getElementById('sendBtn');
            btn.classList.add('loading');
            btn.textContent = 'Đang kiểm tra...';
            
            try {
                const response = await fetch(`${API_BASE}/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(data.message, 'success');
                    currentStep = 2;
                    updateStepUI(2);
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                console.error('Forgot password error:', error);
                showMessage('Lỗi kết nối đến server', 'error');
            } finally {
                btn.classList.remove('loading');
                btn.textContent = 'Gửi yêu cầu';
            }
        }

        // Step 2: Reset password
        async function handleResetSubmit(event) {
            event.preventDefault();
            
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            if (!newPassword || !confirmPassword) {
                showMessage('Vui lòng nhập đầy đủ mật khẩu', 'error');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showMessage('Mật khẩu xác nhận không khớp', 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showMessage('Mật khẩu phải có ít nhất 6 ký tự', 'error');
                return;
            }
            
            const btn = document.getElementById('resetBtn');
            btn.classList.add('loading');
            btn.textContent = 'Đang xử lý...';
            
            try {
                const response = await fetch(`${API_BASE}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ newPassword, confirmPassword })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(data.message, 'success');
                    
                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                console.error('Reset password error:', error);
                showMessage('Lỗi kết nối đến server', 'error');
            } finally {
                btn.classList.remove('loading');
                btn.textContent = 'Đặt lại mật khẩu';
            }
        }

        // Email validation helper
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Add real-time validation
        emailInput.addEventListener('input', function() {
            if (this.value && !isValidEmail(this.value)) {
                this.classList.add('error');
            } else {
                this.classList.remove('error');
            }
        });

        // Enter key support
        emailInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && currentStep === 1) {
                handleEmailSubmit(e);
            }
        });

        newPasswordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && currentStep === 2) {
                handleResetSubmit(e);
            }
        });

        // Event listeners
        document.getElementById('emailForm').addEventListener('submit', handleEmailSubmit);
        document.getElementById('resetForm').addEventListener('submit', handleResetSubmit);

        // Auto focus on first input
        emailInput.focus();

        // Check if already logged in (redirect to dashboard)
        async function checkAuth() {
            try {
                const response = await fetch(`${API_BASE}/check`);
                const data = await response.json();
                if (data.isAuthenticated) {
                    window.location.href = '/dashboard.html';
                }
            } catch (error) {
                console.error('Check auth error:', error);
            }
        }
        checkAuth();
    </script>
</body>
</html>
